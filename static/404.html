<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>404 — Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: #eef2ff;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.24), transparent 32rem),
        radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.18), transparent 30rem),
        #0b1020;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.12);
      filter: blur(80px);
      pointer-events: none;
    }

    .glow.one {
      top: -12rem;
      right: -8rem;
    }

    .glow.two {
      bottom: -14rem;
      left: -8rem;
      background: rgba(14, 165, 233, 0.12);
    }

    main {
      position: relative;
      width: min(92vw, 680px);
      padding: 3.5rem 2.5rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 28px;
      background: rgba(17, 24, 39, 0.58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .code {
      margin: 0;
      font-size: clamp(6rem, 25vw, 11rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 15%, #a5b4fc 55%, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 60px rgba(99, 102, 241, 0.15);
    }

    h1 {
      margin: 1.5rem 0 0.75rem;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 auto;
      max-width: 30rem;
      color: #aeb8d0;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
    }

    .home {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 1.3rem;
      border-radius: 12px;
      color: #0b1020;
      background: #f8fafc;
      text-decoration: none;
      font-weight: 700;
      transition: transform 160ms ease, box-shadow 160ms ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    .home:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.3);
    }

    .home:active {
      transform: translateY(0);
    }

    .arrow {
      font-size: 1.15rem;
      transition: transform 160ms ease;
    }

    .home:hover .arrow {
      transform: translateX(-3px);
    }

    .label {
      margin-top: 2.5rem;
      color: #667085;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      main {
        padding: 3rem 1.5rem;
        border-radius: 22px;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main>
    <div class="code">404</div>

    <h1>Looks like you're off the map.</h1>

    <p>
      The page you're looking for doesn't exist, may have moved,
      or the address might be incorrect.
    </p>

    <div class="actions">
      <a class="home" href="/">
        <span class="arrow">←</span>
        Back to home
      </a>
    </div>

    <div class="label">Page not found</div>
  </main>
</body>
</html>
